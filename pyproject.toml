[project]
name = "avatar-studio"
version = "0.1.0"
description = "Crea tu avatar 2D animado y produce videos narrados por él, guiado por Claude o Codex."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "openai>=1.60",
]

[project.scripts]
avatar = "avatar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["avatar"]
